<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#dzGrad)"/>
  <circle cx="256" cy="256" r="180" fill="#0b131e" fill-opacity="0.3"/>
  <!-- Car Silhouette & Shield / Leaf / Check -->
  <g transform="translate(96, 128) scale(0.65)" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Truck / Car Front -->
    <path d="M70 200 L110 90 L390 90 L430 200 L450 200 C470 200 480 215 480 235 L480 340 C480 360 465 370 445 370 L430 370"/>
    <path d="M70 370 L55 370 C35 370 20 360 20 340 L20 235 C20 215 30 200 50 200 L70 200"/>
    <!-- Windshield -->
    <path d="M120 120 L380 120 L350 210 L150 210 Z" fill="#10b981" fill-opacity="0.15"/>
    <!-- Wheels -->
    <circle cx="120" cy="370" r="50" fill="#0b131e" stroke="#34d399" stroke-width="24"/>
    <circle cx="380" cy="370" r="50" fill="#0b131e" stroke="#34d399" stroke-width="24"/>
    <!-- Lights -->
    <circle cx="90" cy="260" r="16" fill="#fbbf24" stroke="none"/>
    <circle cx="410" cy="260" r="16" fill="#fbbf24" stroke="none"/>
    <!-- Grille -->
    <line x1="200" y1="260" x2="300" y2="260" stroke="#6ee7b7" stroke-width="16"/>
    <line x1="210" y1="295" x2="290" y2="295" stroke="#6ee7b7" stroke-width="16"/>
  </g>
  <text x="256" y="440" font-family="sans-serif" font-size="44" font-weight="900" fill="#ecfdf5" text-anchor="middle" letter-spacing="4">DZ-FLEET</text>
</svg>
